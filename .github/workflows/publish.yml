name: Publish

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: write

# Notebooks are not executed when rendering (Quarto publishes the outputs saved in each
# .ipynb), so the build needs Quarto but not Python.
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
