# Put this file in .github/workflows/publish.yml
# Renders the site from _freeze/ (no Python execution needed for frozen posts) and publishes to gh-pages.
# One-time setup: run `quarto publish gh-pages` locally once, and in GitHub → Settings → Actions → General
# set "Workflow permissions" to "Read and write".
name: Publish

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
