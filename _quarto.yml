project:
  type: website
  output-dir: _site
  resources:
    - CNAME                     # custom domain for GitHub Pages
  render:                       # only site pages; each article is a notebook inside <topic>/notebooks/
    - index.qmd
    - temas.qmd
    - method.qmd
    - about.qmd
    - "*/index.qmd"             # topic pages (poblacion/, vivienda/…)
    - "*/notebooks/*.ipynb"     # the articles

lang: es

execute:
  freeze: auto
  warning: false

website:
  title: "La Mirada del Dato"
  description: "Análisis breves con datos públicos sobre los grandes debates de España."
  site-url: https://lamiradadeldato.com
  repo-url: https://github.com/FabioScielzoOrtiz/la-mirada-del-dato
  favicon: images/logo.png
  open-graph: true
  search: true
  navbar:
    title: "La Mirada del Dato"
    logo: images/logo.png
    left:
      - href: index.qmd
        text: Inicio
      - href: temas.qmd
        text: Temas
      - href: method.qmd
        text: Método
      - href: about.qmd
        text: Sobre el blog
    right:
      - icon: github
        href: https://github.com/FabioScielzoOrtiz/la-mirada-del-dato
      - icon: rss
        href: index.xml
  page-footer:
    left: "© 2026 Fabio Scielzo Ortiz"
    right: "Contenido CC BY 4.0 · Código MIT · Hecho con [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, assets/styles.scss, assets/light.scss]
      dark: [darkly, assets/styles.scss, assets/dark.scss]
    respect-user-color-scheme: true
    toc: true
    toc-title: "En este análisis"
    code-fold: true
    code-summary: "Ver código"
    fig-align: center
    link-external-newwindow: true
